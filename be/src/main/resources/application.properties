spring.application.name=hackathon
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sealhackathon
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization configuration
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:schema.sql

# JWT security configurations
jwt.secret=9a2f689e4726487a9b9a695d51dc611b8b8098c1f01c77840134cd988f01c23a
jwt.expiration=86400000

# OpenAPI Swagger settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

